name: Build

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

# a queued run of an older commit has nothing to say once a newer one exists
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # the test suites need a display: the Tycho surefire run starts a real
      # Equinox, and anything that touches SWT dies without one
      - name: Build and test
        run: xvfb-run -a mvn -B clean verify

      - name: Publish the test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: tests/*/target/surefire-reports/
          if-no-files-found: warn
