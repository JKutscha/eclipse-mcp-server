name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish under releases/, for example 0.1.0'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" = workflow_dispatch ]; then
            echo "value=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        run: mvn -B clean verify

      - name: Check out the update site
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages

      - name: Add the release to the update site
        run: |
          version="${{ steps.version.outputs.value }}"
          rm -rf "gh-pages/releases/$version"
          mkdir -p "gh-pages/releases/$version"
          cp -r update-site/com.vogella.eclipse.mcp.repository/target/repository/. "gh-pages/releases/$version"
          releng/update-composite-site.sh gh-pages

      - name: Publish the update site
        working-directory: gh-pages
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m "Publish ${{ steps.version.outputs.value }}"
          git push

      - name: Attach the repository archive to the release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          built=$(find update-site/com.vogella.eclipse.mcp.repository/target -maxdepth 1 -name '*.zip' | head -1)
          # the built name carries the Maven -SNAPSHOT suffix, which is misleading on a release
          archive="com.vogella.eclipse.mcp.repository-${{ steps.version.outputs.value }}.zip"
          cp "$built" "$archive"
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes || true
          gh release upload "$GITHUB_REF_NAME" "$archive" --clobber
