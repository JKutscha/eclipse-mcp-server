# Externalized strings for about.ini, shown in Help > About Eclipse IDE > Installation Details.
blurb=Eclipse MCP Server\n\
\n\
Version: {featureVersion}\n\
\n\
Turns this IDE into an MCP server, so that external LLM clients can query the\n\
resolved Java model, the problem markers of the incremental builder and the\n\
current editor context.\n\
\n\
Enable it in Preferences > General > MCP Server. It is off by default and\n\
listens on the loopback interface only.\n\
\n\
https://github.com/vogellacompany/eclipse-mcp-server\n\
